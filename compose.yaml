name: weather-api

x-environment: &environment
    APP_NAME: ${APP_NAME:-Weather API}
    APP_KEY: ${APP_KEY:?APP_KEY must be set in .env (php artisan key:generate)}
    APP_URL: http://localhost:${APP_PORT:-8080}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-weather_api}
    DB_USERNAME: ${DB_USERNAME:-weather_api}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    SESSION_DRIVER: database
    # Set to true once the app is served over HTTPS, otherwise login breaks on plain HTTP.
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    MAIL_MAILER: log

x-app: &app
    image: weather-api:latest
    restart: unless-stopped
    environment: *environment
    volumes:
        - storage:/app/storage

x-worker: &worker
    <<: *app
    environment:
        <<: *environment
        RUN_MIGRATIONS: 'false'
    healthcheck:
        disable: true
    depends_on:
        app:
            condition: service_healthy

services:
    app:
        <<: *app
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${APP_PORT:-8080}:8080'
        depends_on:
            db:
                condition: service_healthy

    queue:
        <<: *worker
        command:
            ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']

    scheduler:
        <<: *worker
        command: ['php', 'artisan', 'schedule:work']

    db:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-weather_api}
            POSTGRES_USER: ${DB_USERNAME:-weather_api}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
        # Bound to localhost only so `composer run dev` can reach it without exposing it on the network.
        ports:
            - '127.0.0.1:${DB_FORWARD_PORT:-5432}:5432'
        volumes:
            - postgres:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    storage:
    postgres:
